<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#FDFCFA;
       font-family:"Source Sans 3",Helvetica,Arial,sans-serif;color:#1E2742;
       padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:18px}
  .mark{width:56px;height:56px;border-radius:10px;background:#05164D;color:#FDFCFA;
        display:flex;align-items:center;justify-content:center;
        font-size:26px;font-weight:700;letter-spacing:-1px}
  .host{font-size:19px;letter-spacing:3px;text-transform:uppercase;color:#5A6070}
  h1{font-size:88px;font-weight:700;color:#05164D;letter-spacing:-2px;line-height:1.05}
  .lede{margin-top:20px;font-size:33px;line-height:1.35;max-width:900px}
  .foot{display:flex;align-items:center;gap:14px}
  .rule{width:64px;height:4px;background:#00AFCB}
  .foot span{font-size:23px;color:#5A6070}
</style></head><body>
  <div class="top"><div class="mark">PM</div><div class="host">attentionmatters.github.io</div></div>
  <div>
    <h1>Peter M.</h1>
    <p class="lede">Where the field&rsquo;s people come from, and which groups actually produce them.</p>
  </div>
  <div class="foot"><div class="rule"></div><span>AI talent &middot; ecosystem maps &middot; tools</span></div>
</body></html>
